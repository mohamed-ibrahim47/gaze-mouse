[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gazemouse"
version = "0.1.0"
description = "Control a Windows laptop with only your eyes, using the built-in webcam."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "mediapipe==1.2.0",
    "opencv-contrib-python>=4.10,<5",  # mediapipe needs contrib; 5.0 cannot open cameras by index
    "numpy",
    "PySide6",
    "uiautomation",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs src/gazemouse/models/face_landmarker.task (run scripts/fetch_model.py)"]
